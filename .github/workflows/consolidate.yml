name: One-off image folder cleanup

# Manual, one-time job: moves the card images from "images 2" and "images 3" into
# images/, removes those two folders and points js/main.js back to images/.
# Delete this file after it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move files and fix the code
        run: |
          set -euo pipefail
          test -d "images 2" && test -d "images 3"

          # second batch of card frames: images 2/<project>/ -> images/<project>/
          cp -r "images 2/." images/
          # Simona card frames: images 3/simona/ -> images/simona/ (replaces 1-5.webp, adds mobile/)
          cp -r "images 3/simona/." images/simona/
          git rm -r -q "images 2" "images 3"
          rm -rf "images 2" "images 3"

          python3 - <<'PY'
          p = "js/main.js"
          s = open(p, encoding="utf-8").read()

          def rep(old, new, count=1):
              global s
              assert s.count(old) == count, (old[:60], s.count(old))
              s = s.replace(old, new)

          # drop the CARD_DIR helper (comment line + definition line)
          lines = s.split("\n")
          keep = [l for l in lines
                  if not l.startswith("// the second batch of card frames was uploaded into the folder")
                  and not l.startswith("const CARD_DIR = ")]
          assert len(lines) - len(keep) == 2, len(lines) - len(keep)
          s = "\n".join(keep)
          rep("    const d = CARD_DIR(id);\n", "")
          rep("`${d}/${id}/${n}.webp`", "`images/${id}/${n}.webp`")
          rep("`${d}/${id}/mobile/${n}.webp`", "`images/${id}/mobile/${n}.webp`")
          # Simona
          rep("`images%203/simona/${n}.webp`", "`images/simona/${n}.webp`")
          rep("`images%203/simona/mobile/${n}.webp`", "`images/simona/mobile/${n}.webp`")
          rep(' // card frames were uploaded into the folder "images 3"', "")
          assert "images%20" not in s and "CARD_DIR" not in s
          open(p, "w", encoding="utf-8").write(s)
          PY

          # --- publish ---
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tidy images: move card frames from 'images 2' and 'images 3' into images/, point code back to images/"
          git push
